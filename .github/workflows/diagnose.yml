name: Diagnose LOLA build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**"
      - "package.json"
      - "tsconfig.json"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Capture build output
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "BUILD_EXIT_CODE=$code" >> build.log
          cat build.log
          exit 0
      - name: Commit build log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.log
          git commit -m "diagnostic: capture build log [skip ci]" || exit 0
          git push
